# Phase 3 — Linear measure-preserving FIBER.  W = QZ,  QᵀQ = I.
#
# Because N(0,I) is rotationally invariant, ANY orthogonal Q preserves the measure
# exactly. So this phase asks one sharp question and nothing else:
#   which k-dimensional subspace of latent space survives the channel best?
#
# The central quantity is NOT a learned Q but the Generative Observability Spectrum
#   C_obs = Cov(E[Z|Y]),   lambda_j = 1 - MMSE_j in [0,1],   Tr(C_obs) = effective
#   number of recoverable dimensions.
# See PLAN.md §3.

defaults: {model: sd15.yaml, channels: channels.yaml}

dataset:
  root: /ssd2/ming/FIBER/cache
  # Disjoint in latent seed AND prompt (tests/test_split_disjoint.py asserts it).
  splits: {train: 10000, val: 1000, test: 1000}
  pilot:  {train: 2000,  val: 256,  test: 256}
  # Cross-fit (PLAN.md §4, extended by P0-1): every sample plays exactly one role.
  #   A_teacher  -> fit the teacher f(Y)
  #   A_operator -> estimate C_cert and freeze the directions
  #   B          -> fresh evaluation extractor (EVERY arm, identical budget)
  #   val        -> all model/hyperparameter selection
  #   test       -> locked evaluation only
  # Teacher and operator must not share samples: the operator would otherwise read
  # back the teacher's own fitting noise as observability.
  crossfit:
    discovery_split: A
    extractor_split: B
    teacher_subsplit: A_teacher
    operator_subsplit: A_operator
    ratio: 0.5
    teacher_operator_ratio: 0.5
  prompts:
    source: /ssd2/ming/STEGO/datasets/COCO/annotations/captions_train2017.json
    heldout_source: /ssd2/ming/STEGO/datasets/COCO/annotations/captions_val2017.json
    # 100 prompts (InvCISD's text_prompt.yaml) is far too few: the extractor would
    # memorise prompt->image structure and infer z indirectly. PLAN.md R6.
    num_train_prompts: 20000
    num_heldout_prompts: 2000

fiber:
  robust_dims: 64                 # ablation: [16, 32, 64, 128, 256]
  arms:
    # Sanity only. Identity loses to any global transform for a trivial locality
    # reason, so NO gate ever compares against it (PLAN.md R1).
    A_identity:   {type: identity, seeds: [0]}
    # PRIMARY random reference (P0-2). A uniformly random k-dimensional subspace is
    # the null the scientific claim is actually against: "derived > Haar" is evidence
    # that the channel has anisotropic observability, whereas "derived > Hadamard"
    # would only say it beats one structured family. Many draws: "learned > random"
    # from ONE random subspace is indefensible. Report E_Q[BER], spread, best draw.
    C2_haar:      {type: haar, seeds: [0,1,2,3,4,5,6,7]}
    # Controls, reported alongside but never the gate denominator.
    B_signperm:   {type: signed_permutation, seeds: [0,1,2,3,4,5,6,7]}   # local
    C_hadamard:   {type: hadamard, structure: P2_H_D_P1, seeds: [0,1,2,3,4,5,6,7]}  # global, structured
    # Arm E's architecture AND starting point, frozen. With the Haar base and the
    # paired initialisation this is bit-identical to C2 at the same seed -- which is
    # the point: at init the parameterisation contributes nothing, so any arm-E gain
    # is learning. Kept as an executable check that the base and paired init hold.
    C3_frozen_hh: {type: frozen_householder_on_haar, num_reflectors: 128,
                   base: haar, paired_init: true, seeds: [0]}
    # The Observability Spectrum. Top-k eigenvectors of C_obs.
    D_spectral:   {type: spectral_topk, seeds: [0,1,2]}
    # R_E = Q_phi H with H a FROZEN Haar frame and Q_phi(0) = I EXACTLY (reflectors
    # initialised in identical pairs, H(v)H(v) = I). So arm E starts at the gate
    # denominator instead of at identity, which measurement showed is where a
    # random-reflector Householder product actually begins (P0-4).
    E_learned:    {type: householder, num_reflectors: 128, base: haar,
                   paired_init: true, seeds: [0,1,2]}

spectrum:
  # P0-1. The estimated object is the DECODER-CERTIFIED operator
  #   C_cert(f) = E[z_c f_c' + f_c z_c' - f_c f_c']  =  C_obs - E[(m-f)(m-f)']  <=  C_obs
  # not Cov(f(Y)), which is NOT a lower bound on C_obs for an approximate teacher.
  operator: certified             # certified | teacher_covariance (diagnostic only)

  # MSE IS MANDATORY: L2 regression converges to the conditional MEAN; L1 converges to
  # the conditional MEDIAN, which is not what the derivation requires.
  teacher_loss: mse
  # The operator is certified BY a decoder class, so the architecture is part of the
  # claim (P0-5). `resnet18` pools globally and its output covariance has rank <= 512
  # regardless of the channel; `spatial` has no global pooling. Both are fitted and the
  # top-k subspace alignment between them is reported. Until they agree, the wording is
  # "decoder-certified observability geometry", never "intrinsic".
  teacher_arch: resnet18
  teacher_arch_control: spatial

  # C_cert is INDEFINITE. Any solver that ranks by |eigenvalue| -- every SVD-based
  # routine -- returns the directions the decoder is WORST on as the top-k. The
  # eigensolver must be algebraically largest.
  #   range_eigh : exact; eigendecomposition restricted to range(C_cert) (rank <= 2N).
  #                Preferred because d=16384 >> 2N makes the zero eigenvalue massively
  #                degenerate, where ARPACK stalls, and because it returns the complete
  #                signed spectrum so the positive/negative masses are exact.
  #   eigsh_la   : scipy Lanczos, which="LA". Independent cross-check.
  eigensolver: range_eigh
  oversampling: 32
  center: true                    # a teacher output bias otherwise injects a rank-1 direction

  # Reported scalars. Tr(C_cert) can be NEGATIVE, so it is never the headline, and
  # the headline is a property of the SUBSPACE, not of the discovery basis (P0-1.1):
  #   mu        = eig(V C_cert^held V')          k x k restriction to span(V)
  #   D_cert(V) = sum_j max(mu_j, 0)             certified observability mass
  #   D^-       = sum_j max(-mu_j, 0)            decoder-misspecification diagnostic
  # Clipping the DIAGONAL instead is basis dependent: C_V = [[-1,2],[2,-1]] clips to 0
  # while its eigenvalues are (1,-3). diag(V C_cert^held V') is still reported as
  # coordinate_skill, because sign coding IS basis dependent (P0-7) -- never as mass.
  # Positive rank is reported against the request, with a numerical-zero tolerance
  #   tau = max(1e-9, k * eps * max|mu|)
  # so 1e-16 eigenvalues cannot become certified mass. k is never chosen on test.
  positive_rank_floor: 1.0e-9
  # EVERY reported eigenvalue is cross-fitted on a held-out split: in-sample spectra
  # are inflated far past the theoretical bound of 1 (measured lambda_max = 7.2 with an
  # EXACT teacher at N=200, d=4096) and are used only to choose directions.
  report_split: val
  validity_tol: 0.10              # gate on mean |lambda_var - lambda_skill|
  fit_on: train_attack_mixture    # one spectrum for the main arm...
  report_per_attack: true         # ...plus the fixed-decoder operational spectrum per attack
  synthetic_test_first: true      # PLAN.md §3.5 — validate on Y = AZ + noise, no GPU

extractor:
  # The receiver has the SAME global-pooling bias as the teacher: GAP discards where a
  # feature occurred, which is what a local frame needs, so reading only through GAP
  # could favour global frames for a receiver-side reason. The locked method and the
  # Haar reference are additionally evaluated with `arch_control` (P0-5).
  arch: resnet18
  arch_control: spatial
  pretrained: false               # must not be an ImageNet-semantic shortcut
  in_resolution: 512
  # GAUSSIAN heads, NOT circular. In Level 1 W = QZ ~ N(0,I) is not a torus variable;
  # (cos 2piW, sin 2piW) would alias W and W+1 onto the same target. Circular heads
  # belong to Phase 4/5 after U = Phi(Z).  PLAN.md §5.2.
  heads:
    regression: {enabled: true,  loss: mse, weight: 1.0}   # diagnostic
    sign:       {enabled: true,  loss: bce, weight: 1.0}   # PRIMARY metric: sign BER
    circular:   {enabled: false}                           # Phase 4+ only

# Receiver protocol: H(Y). The prompt is NOT receiver-side information in the MVP.
# DDIM inversion therefore is not a fair baseline -- it is plotted as a dashed
# "prompt-assisted reference (violates the receiver protocol)" whose only job is to
# separate "weak channel" from "weak extractor".  PLAN.md §5.3.
threat_model:
  receiver_sees: [received_image]
  prompt_is_public: false
  ddim_inversion_reference: {enabled: true, role: capacity_diagnostic_only}

training:
  batch_size: 16
  lr: 2.0e-4
  optimizer: adamw
  weight_decay: 1.0e-4
  epochs: 40
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  joint_training: true            # discovery stage only; alternating if unstable
  # Discovery optimises MSE ONLY. A hard sign target 1[W>0] has no gradient path to
  # the frame, so including it would look like sign-BER optimisation while actually
  # being MSE-only (P0-4). Frame parameters also get weight_decay = 0: H(v) depends
  # only on v/||v||, so decay does not regularise the transform.
  discovery_objective: mse
  frame_weight_decay: 0.0

eval:
  primary_metric: sign_ber
  diagnostics: [coord_mse, coord_pearson, spectrum_lambda, trace_c_obs]
  report_per_attack: true
  # Paired bootstrap, NOT "do the CIs overlap": every arm is evaluated on the same
  # (z_i, prompt_i, attack_i), so the paired difference is the correct statistic.
  statistic: paired_bootstrap
  bootstrap_resamples: 10000

# ---- Gates.  3A decides whether the science holds; 3B only decides the story. ----
gate3a:
  # min(BER_spectral, BER_learned) < BER_haar, in >=3 of 5 channel groups.
  # The denominator is the HAAR family specifically, not "whichever random family is
  # hardest to beat": the claim is about anisotropy against a uniform subspace. The
  # other random families are reported as controls, and a control beating the derived
  # arm is flagged prominently -- picking the weakest random family as denominator
  # would be exactly the kind of free win this gate exists to prevent.
  primary_random_reference: C2_haar
  comparison: data_derived_vs_haar
  min_conditions_improved: 3
  paired_ci_lower_bound: 0.0      # CI95(delta BER) > 0
  target_relative_reduction: 0.20
  min_absolute_reduction: 0.02    # so 0.005 -> 0.004 cannot be sold as "20% better"
  orthogonality_tol: 1.0e-5
  require_heldout_prompts: true
  # THE ONLY KILL CONDITION: data-derived subspace indistinguishable from random.
  kill_if_relative_reduction_below: 0.01

gate3b:
  # Framing only. learned > spectral, learned ~= spectral and spectral > learned are
  # ALL acceptable outcomes; none stops the project.  PLAN.md §7.
  comparison: learned_vs_spectral
  is_kill_gate: false
